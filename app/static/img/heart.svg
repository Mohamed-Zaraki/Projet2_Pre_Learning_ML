<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="heartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="240" rx="16" fill="url(#cardBg)"/>

  <!-- Decorative pulse circular waves -->
  <circle cx="200" cy="115" r="95" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <circle cx="200" cy="115" r="75" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Heart Shape with Drop Shadow -->
  <g filter="url(#glow)">
    <path d="M 200,165 
             C 170,140 135,115 135,85 
             C 135,60 155,45 178,45 
             C 190,45 198,52 200,56 
             C 202,52 210,45 222,45 
             C 245,45 265,60 265,85 
             C 265,115 230,140 200,165 Z" 
          fill="url(#heartBg)"/>
  </g>

  <!-- Highlight gloss on heart -->
  <path d="M 150,75 C 150,62 162,54 175,54 C 178,54 165,66 160,82 C 158,88 150,85 150,75 Z" fill="#ffffff" opacity="0.4"/>

  <!-- ECG / Heartbeat Monitor Line -->
  <path d="M 40,120 
           L 130,120 
           L 145,120 
           L 155,100 
           L 165,145 
           L 180,60 
           L 195,160 
           L 208,95 
           L 218,135 
           L 228,120 
           L 360,120" 
        fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing pulse dot on ECG line -->
  <circle cx="208" cy="95" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="208" cy="95" r="2.5" fill="#be123c"/>

  <!-- Badge text -->
  <g transform="translate(200, 205)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#be123c" opacity="0.9"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">CARDIAC METRICS</text>
  </g>
</svg>

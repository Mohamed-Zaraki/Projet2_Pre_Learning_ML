<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="parkinsonCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="brainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="240" rx="16" fill="url(#parkinsonCardBg)"/>

  <!-- Neural network background constellations (Biomarkers & Neuroimaging) -->
  <g stroke="#c084fc" stroke-width="1" stroke-opacity="0.4">
    <line x1="60" y1="50" x2="110" y2="70"/>
    <line x1="110" y1="70" x2="80" y2="130"/>
    <line x1="80" y1="130" x2="50" y2="170"/>
    <line x1="340" y1="50" x2="290" y2="70"/>
    <line x1="290" y1="70" x2="320" y2="130"/>
    <line x1="320" y1="130" x2="350" y2="170"/>
  </g>
  <circle cx="60" cy="50" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="110" cy="70" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="80" cy="130" r="3.5" fill="#a855f7" opacity="0.6"/>
  <circle cx="340" cy="50" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="290" cy="70" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="320" cy="130" r="3.5" fill="#a855f7" opacity="0.6"/>

  <!-- Center: Stylized Human Brain / Neuro-cortex -->
  <g transform="translate(200, 105)" filter="url(#brainGlow)">
    <!-- Left Hemisphere -->
    <path d="M -5,-55 
             C -25,-55 -45,-42 -52,-25 
             C -62,-25 -72,-10 -70,10 
             C -72,25 -65,40 -50,50 
             C -45,60 -30,65 -15,60 
             C -10,60 -5,55 -5,50 Z" 
          fill="url(#brainGrad)" opacity="0.95"/>
          
    <!-- Right Hemisphere -->
    <path d="M 5,-55 
             C 25,-55 45,-42 52,-25 
             C 62,-25 72,-10 70,10 
             C 72,25 65,40 50,50 
             C 45,60 30,65 15,60 
             C 10,60 5,55 5,50 Z" 
          fill="url(#brainGrad)" opacity="0.95"/>

    <!-- Brain Stem -->
    <path d="M -8,52 C -8,72 -2,78 0,78 C 2,78 8,72 8,52 Z" fill="#6d28d9"/>

    <!-- Sulci / Gyri folds inside Left hemisphere -->
    <path d="M -40,-20 C -25,-25 -20,-5 -35,5 C -45,15 -25,25 -15,20" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M -35,32 C -20,40 -12,30 -8,40" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M -42,-5 C -48,-15 -35,-35 -20,-42" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Sulci / Gyri folds inside Right hemisphere -->
    <path d="M 40,-20 C 25,-25 20,-5 35,5 C 45,15 25,25 15,20" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 35,32 C 20,40 12,30 8,40" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 42,-5 C 48,-15 35,-35 20,-42" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Central Synaptic connection / Putamen Caudate glow points -->
    <circle cx="-18" cy="8" r="4.5" fill="#facc15"/>
    <circle cx="18" cy="8" r="4.5" fill="#facc15"/>
    <line x1="-18" y1="8" x2="18" y2="8" stroke="#facc15" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="0" cy="-20" r="3.5" fill="#38bdf8"/>
    <circle cx="0" cy="25" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Badge text -->
  <g transform="translate(200, 205)">
    <rect x="-95" y="-14" width="190" height="26" rx="13" fill="#6d28d9" opacity="0.9"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">NEURAL BIOMARKERS</text>
  </g>
</svg>

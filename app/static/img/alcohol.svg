<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="alcoholCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="thermalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="drinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="240" rx="16" fill="url(#alcoholCardBg)"/>

  <!-- Thermal infrared background wave curves (Facial Temp & Ambient Temp) -->
  <path d="M 40,80 Q 110,60 160,85 T 260,85 T 360,75" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="5 5"/>
  <path d="M 40,140 Q 120,165 190,140 T 320,150 T 360,135" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Left: Stylized Thermal Sensing Eye (Ocular biometrics from dataset EYES column) -->
  <g transform="translate(100, 110) scale(0.9)">
    <path d="M -35,0 Q 0,-25 35,0 Q 0,25 -35,0 Z" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="url(#thermalGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    <circle cx="-3" cy="-3" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Right: Stylized Thermometer (TEMP_FAC_MAX / MIN) -->
  <g transform="translate(300, 110)">
    <rect x="-6" y="-45" width="12" height="60" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="-3" y="-15" width="6" height="30" rx="3" fill="#ef4444"/>
    <circle cx="0" cy="22" r="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <circle cx="0" cy="22" r="9" fill="#ef4444"/>
  </g>

  <!-- Center: Elegant Cocktail / Glass (ALCOHOL) -->
  <g transform="translate(200, 105)" filter="url(#drinkGlow)">
    <!-- Glass Stem & Base -->
    <path d="M -22,58 L 22,58 M 0,20 L 0,58" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Glass Bowl Triangle -->
    <path d="M -38,-35 L 38,-35 L 0,20 Z" fill="#ffffff" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Liquid Content -->
    <path d="M -28,-18 L 28,-18 L 0,20 Z" fill="url(#liquidGrad)"/>

    <!-- Garnish / Olive & skewer -->
    <line x1="-30" y1="-44" x2="15" y2="-10" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-10" cy="-28" r="6" fill="#10b981"/>
    <circle cx="-10" cy="-28" r="2.5" fill="#ef4444"/>

    <!-- Rising bubbles -->
    <circle cx="-6" cy="-6" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="6" cy="-10" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="1" cy="4" r="1.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Badge text -->
  <g transform="translate(200, 205)">
    <rect x="-95" y="-14" width="190" height="26" rx="13" fill="#b45309" opacity="0.9"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">ALCOHOL BIOMETRICS</text>
  </g>
</svg>

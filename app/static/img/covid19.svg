<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="virusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardBgCovid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="virusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="240" rx="16" fill="url(#cardBgCovid)"/>

  <!-- Background microscopic grid lines -->
  <line x1="60" y1="0" x2="60" y2="240" stroke="#14b8a6" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#14b8a6" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="240" stroke="#14b8a6" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#14b8a6" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Smaller secondary background virions -->
  <g opacity="0.3" transform="translate(70, 60) scale(0.4)">
    <circle cx="0" cy="0" r="45" fill="#0d9488"/>
    <!-- mini spikes -->
    <circle cx="0" cy="-55" r="7" fill="#f59e0b"/>
    <circle cx="45" cy="-35" r="7" fill="#f59e0b"/>
    <circle cx="55" cy="0" r="7" fill="#f59e0b"/>
    <circle cx="35" cy="45" r="7" fill="#f59e0b"/>
    <circle cx="-45" cy="35" r="7" fill="#f59e0b"/>
    <circle cx="-55" cy="0" r="7" fill="#f59e0b"/>
  </g>
  <g opacity="0.25" transform="translate(330, 160) scale(0.35)">
    <circle cx="0" cy="0" r="45" fill="#0d9488"/>
    <circle cx="0" cy="-55" r="7" fill="#f59e0b"/>
    <circle cx="55" cy="0" r="7" fill="#f59e0b"/>
    <circle cx="0" cy="55" r="7" fill="#f59e0b"/>
    <circle cx="-55" cy="0" r="7" fill="#f59e0b"/>
  </g>

  <!-- Central Main Virus Particle -->
  <g transform="translate(200, 110)">
    <!-- 12 Crown Spikes (Peplomers) -->
    <!-- Top & Bottom -->
    <g stroke="#d97706" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-50" x2="0" y2="-72"/>
      <line x1="0" y1="50" x2="0" y2="72"/>
      <line x1="-50" y1="0" x2="-72" y2="0"/>
      <line x1="50" y1="0" x2="72" y2="0"/>
      <!-- Diagonals -->
      <line x1="35" y1="35" x2="52" y2="52"/>
      <line x1="-35" y1="-35" x2="-52" y2="-52"/>
      <line x1="35" y1="-35" x2="52" y2="-52"/>
      <line x1="-35" y1="35" x2="-52" y2="52"/>
      <!-- Intermediate -->
      <line x1="18" y1="-46" x2="28" y2="-66"/>
      <line x1="-18" y1="-46" x2="-28" y2="-66"/>
      <line x1="46" y1="-18" x2="66" y2="-28"/>
      <line x1="46" y1="18" x2="66" y2="28"/>
      <line x1="-46" y1="-18" x2="-66" y2="-28"/>
      <line x1="-46" y1="18" x2="-66" y2="28"/>
      <line x1="18" y1="46" x2="28" y2="66"/>
      <line x1="-18" y1="46" x2="-28" y2="66"/>
    </g>

    <!-- Spike Heads (Protein balls) -->
    <circle cx="0" cy="-74" r="7" fill="url(#spikeGrad)"/>
    <circle cx="0" cy="74" r="7" fill="url(#spikeGrad)"/>
    <circle cx="-74" cy="0" r="7" fill="url(#spikeGrad)"/>
    <circle cx="74" cy="0" r="7" fill="url(#spikeGrad)"/>
    <circle cx="53" cy="53" r="6.5" fill="url(#spikeGrad)"/>
    <circle cx="-53" cy="-53" r="6.5" fill="url(#spikeGrad)"/>
    <circle cx="53" cy="-53" r="6.5" fill="url(#spikeGrad)"/>
    <circle cx="-53" cy="53" r="6.5" fill="url(#spikeGrad)"/>
    <circle cx="29" cy="-68" r="6" fill="url(#spikeGrad)"/>
    <circle cx="-29" cy="-68" r="6" fill="url(#spikeGrad)"/>
    <circle cx="68" cy="-29" r="6" fill="url(#spikeGrad)"/>
    <circle cx="68" cy="29" r="6" fill="url(#spikeGrad)"/>
    <circle cx="-68" cy="-29" r="6" fill="url(#spikeGrad)"/>
    <circle cx="-68" cy="29" r="6" fill="url(#spikeGrad)"/>
    <circle cx="29" cy="68" r="6" fill="url(#spikeGrad)"/>
    <circle cx="-29" cy="68" r="6" fill="url(#spikeGrad)"/>

    <!-- Main Lipid Membrane Shell -->
    <circle cx="0" cy="0" r="54" fill="url(#virusBg)" filter="url(#virusGlow)"/>

    <!-- Membrane surface texture -->
    <circle cx="-16" cy="-18" r="8" fill="#14b8a6" opacity="0.6"/>
    <circle cx="20" cy="-12" r="10" fill="#0f766e" opacity="0.5"/>
    <circle cx="-8" cy="22" r="9" fill="#14b8a6" opacity="0.5"/>
    <circle cx="22" cy="18" r="7" fill="#0f766e" opacity="0.7"/>

    <!-- Viral RNA Core Helix -->
    <path d="M -22,-6 C -12,-20 12,-20 22,-6 C 12,10 -12,10 -2,22" 
          fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-2" cy="22" r="3" fill="#facc15"/>
    <circle cx="-22" cy="-6" r="3" fill="#facc15"/>
  </g>

  <!-- Badge text -->
  <g transform="translate(200, 205)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#0f766e" opacity="0.9"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">SARS-COV-2 LAB</text>
  </g>
</svg>
